<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole - Atrapa al Topo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔨 Whack-a-Mole 🔨</h1>
        
        <div class="game-info">
            <div class="score-container">
                <span class="label">Puntuación:</span>
                <span id="score" class="score">0</span>
            </div>
            <div class="time-container">
                <span class="label">Tiempo:</span>
                <span id="time" class="time">30</span>
            </div>
        </div>

        <div class="game-board">
            <div class="hole" data-index="0">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="1">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="2">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="3">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="4">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="5">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="6">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="7">
                <div class="mole"></div>
            </div>
            <div class="hole" data-index="8">
                <div class="mole"></div>
            </div>
        </div>

        <button id="startBtn" class="start-btn">Iniciar Juego</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
